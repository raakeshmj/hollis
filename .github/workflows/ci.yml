name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: make sync
      - run: make check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: make web-check
      - run: make web-build

  web-e2e:
    runs-on: ubuntu-latest # ships Google Chrome, which the browser tests use (nothing is downloaded)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make sync
      - run: make web-install
      - run: make web-e2e
