[project]
name = "hollis"
version = "0.1.0"
description = "Model-agnostic platform for building, running, and orchestrating autonomous agents."
readme = "README.md"
authors = [
    { name = "raakeshmj", email = "raakesh.mj7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
]

[project.scripts]
hollis = "hollis:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.3,<3",
]
openai-compatible = [
    "httpx2>=2.16,<3",
]
mcp = [
    "mcp>=2.3,<3",
]
pdf = [
    "pypdf>=5,<7",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hollis[anthropic,openai-compatible,mcp,pdf]",  # adapter tests always run in dev and CI
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "trustme>=1.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "N",        # naming
    "S",        # bandit security
]
ignore = [
    "N818",     # exception names are domain terms (ConcurrencyConflict, RunNotFound)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the pytest idiom
    "ASYNC2",  # blocking I/O in async tests is harmless; still enforced in src/
    "S105", "S106",  # tests use deliberately fake credentials
]
# Evaluation corpora and labelled cases: document text and query tables read better unwrapped.
"tests/evals/rag/corpus.py" = ["E501"]
"tests/evals/rag/grounding_cases.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers from tests.support
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["live: calls a real external API; opt-in, costs money (see tests/live/)"]
