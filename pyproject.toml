[project]
name = "hollis"
version = "0.1.0"
description = "Model-agnostic platform for building, running, and orchestrating autonomous agents."
readme = "README.md"
authors = [
    { name = "raakeshmj", email = "raakesh.mj7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
]

[project.scripts]
hollis = "hollis:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "N",        # naming
    "S",        # bandit security
]
ignore = [
    "N818",     # exception names are domain terms (ConcurrencyConflict, RunNotFound)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the pytest idiom

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers from tests.support
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
