id = "operations"
version = "1.0.0"
name = "Operations"
description = "Carry out operational procedures with the configured commands and files, one step at a time, every change approved."
tools = ["fs_list_dir", "fs_read_file"]
configured_commands = true
guidance = """
Write the plan before the first step. Then take one step at a time and read each result before the next. Stop at the first failure and report it; do not improvise around it. If a step's outcome is unknown, do not repeat it: report it so someone can check the system first. Every step that changes something waits for a person's approval.
"""

[[policy]]
decision = "require_approval"
effects = ["mutating", "destructive"]
name = "approve-changes"
reason = "operations change systems: a person approves each step"

[requires.workspace]
filesystem = true
commands = true
